<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SözKedisi odasına katıl</title>
<link rel="stylesheet" href="style.css">
<style>
  .code { font-size: 2.2rem; font-weight: 800; letter-spacing: .3rem; margin: .2rem 0 1rem; }
  .btn { display: block; text-align: center; padding: 14px 18px; border-radius: 14px; font-weight: 700; text-decoration: none; margin: 12px 0; }
  .primary { background: #ffb72a; color: #2b1b00; }
  .secondary { border: 2px solid var(--link); color: var(--link); }
</style>
</head>
<body>
<main>
<h1>SözKedisi odasına davet edildiniz</h1>
<p>Oda kodu:</p>
<p class="code" id="code">-</p>
<a class="btn primary" id="open" href="#">Uygulamada aç ve katıl</a>
<a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.ramrems.sozkedisi">SözKedisi'ni Google Play'den indir</a>
<p class="muted">Uygulama yüklü değilse önce indirin. Sonra bu bağlantıya yeniden dokunun ya da uygulamada <b>Oda koduyla katıl</b> deyip yukarıdaki kodu yazın.</p>
</main>
<script>
  // Opens sozkedisi://join/<code> in the app on Android; elsewhere, or without the
  // app, Android falls back to the Play Store page.
  var params = new URLSearchParams(location.search);
  var code = (params.get('kod') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8);
  var play = 'https://play.google.com/store/apps/details?id=com.ramrems.sozkedisi';
  document.getElementById('code').textContent = code || '-';
  var link = document.getElementById('open');
  if (/android/i.test(navigator.userAgent) && code) {
    link.href = 'intent://join/' + code + '#Intent;scheme=sozkedisi;package=com.ramrems.sozkedisi;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    setTimeout(function () { location.href = link.href; }, 300);
  } else {
    link.href = play;
  }
</script>
</body>
</html>
